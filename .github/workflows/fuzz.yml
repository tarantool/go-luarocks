name: fuzz

# Explores the differential fuzz targets (each compares the pure-Go
# implementation against the vendored upstream LuaRocks run in gopher-lua; see
# CONTRIBUTING.md). Their seed corpora already run on every pull request as
# part of `go test` in ci.yml; this workflow spends real fuzzing time on them.

on:
  schedule:
    - cron: "0 2 * * 6" # Weekly on Saturday at 02:00 UTC.
  workflow_dispatch:
    inputs:
      fuzztime:
        description: "Fuzzing time per target (go test -fuzztime)"
        type: string
        default: "3m"
      test_notification:
        description: "Send notification regardless of fuzzing outcome (for testing)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: deps, target: FuzzParseVersion }
          - { dir: deps, target: FuzzCompareVersions }
          - { dir: deps, target: FuzzParseConstraints }
          - { dir: deps, target: FuzzMatch }
          - { dir: rockspec, target: FuzzDepString }
          - { dir: rockspec, target: FuzzRockspec }
          - { dir: manif, target: FuzzParse }
          - { dir: manif, target: FuzzWrite }
          - { dir: client, target: FuzzDeduceBaseDir }
          - { dir: client, target: FuzzSplitNamespacedName }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Fuzz
        id: fuzz
        env:
          FUZZTIME: ${{ inputs.fuzztime || '3m' }}
        # A short minimization budget keeps the fuzzer exploring: by default
        # it may spend a minute shrinking each new interesting input.
        run: >-
          go test ./${{ matrix.dir }}/ -run '^$'
          -fuzz '^${{ matrix.target }}$'
          -fuzztime "$FUZZTIME" -fuzzminimizetime 10s

      - name: Upload the failing input
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-failing-input
          path: ${{ matrix.dir }}/testdata/fuzz/${{ matrix.target }}

      - name: Send notification on scheduled run failure
        if: |
          always() &&
          ((github.event_name == 'schedule' && steps.fuzz.outcome == 'failure') ||
           (github.event_name == 'workflow_dispatch' && inputs.test_notification))
        uses: tarantool/actions/report-job-status@master
        with:
          bot-token: ${{ secrets.ECO_VK_WORKSPACE_BOT_TOKEN }}
          chat-id: ${{ secrets.ECO_VK_WORKSPACE_GOVULNCHECK_CHAT_ID }}
          job-name: ${{ github.job }} (${{ matrix.target }})
          job-steps: ${{ toJson(steps) }}
