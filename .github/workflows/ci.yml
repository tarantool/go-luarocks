name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The module's own packages. internal/luarocks/src is the vendored upstream
  # LuaRocks tree, which holds no Go code.
  PKGS: ./build/... ./client/... ./deps/... ./fetch/... ./internal/... ./manif/... ./remote/... ./rockspec/... ./tree/... .

jobs:
  static:
    name: static (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      # --- checks that must not change the repo ---

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go generate (no changes)
        run: |
          go generate ./...
          git diff --exit-code

      - name: go fix (no changes)
        run: |
          go fix ./...
          git diff --exit-code

      - name: go mod tidy (no changes)
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with a Go no older than the one `stable` installs
          # above: golangci-lint type-checks the standard library from source,
          # so an older binary panics on a newer GOROOT ("file requires newer
          # Go version go1.27"). Bump this together with the toolchain.
          version: v2.15.0
          args: ${{ env.PKGS }}

      - name: codespell
        if: runner.os == 'Linux'
        run: |
          pip3 install codespell==2.4.2
          codespell

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The two supported Go releases, named by role rather than by number:
        # the job names are required checks in the master ruleset, and a
        # number there goes stale on every Go release. setup-go resolves
        # `oldstable` and `stable` to the latest patch of the previous and the
        # current minor release.
        go: [previous, current]
        include:
          - go: previous
            go-version: oldstable
          - go: current
            go-version: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ env.PKGS }}

      - name: Test (race)
        run: go test -race ${{ env.PKGS }}

  # The tests behind the `integration` and `integration_luaengine` build tags:
  # real cc/make/cmake/git builds, real-rock installs from luarocks.org, and
  # the backend-parity harness that backs the README's "zero divergence in
  # deployed artifacts" claim. Each of them skips when a prerequisite is
  # missing; strict mode turns those skips into failures, so a broken setup
  # below fails the job instead of leaving it green with nothing run.
  integration:
    name: integration
    runs-on: ubuntu-latest
    env:
      GO_LUAROCKS_INTEGRATION_STRICT: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      # Installs both the tarantool and the tarantool-dev packages: the
      # lua-backend tests need lua.h at <prefix>/include/tarantool, and the
      # binary at /usr/bin/tarantool puts it at /usr/include/tarantool. This
      # is the only step that provisions tarantool; the ones below assume
      # nothing but that layout, so it can be swapped for another source
      # (a pinned container image, say) on its own.
      - uses: tarantool/setup-tarantool@v4
        with:
          tarantool-version: '3'

      - name: Show the toolchain
        run: |
          tarantool --version
          prefix=$(dirname "$(dirname "$(command -v tarantool)")")
          ls -l "$prefix/include/tarantool/lua.h"
          cc --version | head -n 1
          make --version | head -n 1
          cmake --version | head -n 1
          git --version
          unzip -v | head -n 1

      - name: Test (integration)
        run: go test -tags integration,integration_luaengine ${{ env.PKGS }}

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ${{ env.PKGS }}

      - name: Upload to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=coverage.out -service=github
