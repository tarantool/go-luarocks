name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The module's own packages. internal/luarocks/src is the vendored upstream
  # LuaRocks tree, which holds no Go code.
  PKGS: ./build/... ./client/... ./deps/... ./fetch/... ./internal/... ./manif/... ./remote/... ./rockspec/... ./tree/... .

jobs:
  static:
    name: static (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      # --- checks that must not change the repo ---

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go generate (no changes)
        run: |
          go generate ./...
          git diff --exit-code

      - name: go fix (no changes)
        run: |
          go fix ./...
          git diff --exit-code

      - name: go mod tidy (no changes)
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Must be built with a Go no older than the one `stable` installs
          # above: golangci-lint type-checks the standard library from source,
          # so an older binary panics on a newer GOROOT ("file requires newer
          # Go version go1.27"). Bump this together with the toolchain.
          version: v2.15.0
          args: ${{ env.PKGS }}

      - name: codespell
        if: runner.os == 'Linux'
        run: |
          pip3 install codespell==2.4.2
          codespell

  test:
    name: test (${{ matrix.os }}, go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        # The two supported Go releases, named by role rather than by number:
        # the job names are required checks in the master ruleset, and a
        # number there goes stale on every Go release. setup-go resolves
        # `oldstable` and `stable` to the latest patch of the previous and the
        # current minor release.
        go: [previous, current]
        include:
          - go: previous
            go-version: oldstable
          - go: current
            go-version: stable
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ${{ env.PKGS }}

      - name: Test (race)
        run: go test -race ${{ env.PKGS }}

  # The tests behind the `integration` and `integration_luaengine` build tags:
  # real cc/make/cmake/git builds, real-rock installs from luarocks.org, and
  # the backend-parity harness that backs the README's "Backend Parity"
  # section: byte-equal deployed artifacts where the backends share
  # semantics, and the documented divergences where they do not. Each of
  # them skips when a prerequisite is missing; strict mode turns those skips
  # into failures, so a broken setup below fails the job instead of leaving
  # it green with nothing run.
  integration:
    name: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The integration, backend-parity and lua-engine suites run in the
      # sandbox of scripts/test-in-docker.sh: an image with pinned Go and
      # Tarantool (with its headers), a read-only root and source tree, an
      # unprivileged user, strict mode, and a check that nothing was left
      # outside the test's temp dirs. See CONTRIBUTING.md.
      - name: Build the sandbox image
        run: scripts/test-in-docker.sh true

      # Offline: proves the suites that should not need the network do not,
      # and skips the ones that do (GO_LUAROCKS_OFFLINE).
      - name: Test (integration, offline)
        run: scripts/test-in-docker.sh --no-build

      - name: Test (integration, network)
        run: scripts/test-in-docker.sh --no-build --net

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: Test with coverage
        run: go test -coverprofile=coverage.out -covermode=atomic ${{ env.PKGS }}

      - name: Upload to Coveralls
        env:
          COVERALLS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          go install github.com/mattn/goveralls@latest
          goveralls -coverprofile=coverage.out -service=github
